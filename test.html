<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thử form báo giá</title>
  </head>
  <body>
    <h2>Hỏi giá sản phẩm</h2>

    <form id="quote">
      <input name="name" placeholder="Họ tên" required /><br /><br />
      <input name="phone" placeholder="Số điện thoại" required /><br /><br />
      <input
        name="product"
        id="product"
        value="Cảm biến nhiệt độ DHT22"
        readonly
      /><br /><br />
      <textarea name="note" placeholder="Ghi chú"></textarea><br /><br />
      <input
        name="website"
        style="display: none"
        tabindex="-1"
        autocomplete="off"
      />
      <button>Gửi yêu cầu</button>
    </form>

    <script>
      const URL_APPS_SCRIPT =
        "https://script.google.com/macros/s/AKfycbxoqS1qAUj2a_jjcBBDKFS1TTyOmVij-BUFd3elmrxDP9oLxA7OetMUh1GqpNcrOrE1/exec";

      document.getElementById("quote").addEventListener("submit", async (e) => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        try {
          await fetch(URL_APPS_SCRIPT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(data),
          });
          alert("Đã gửi! Mình sẽ liên hệ lại sớm.");
          e.target.reset();
        } catch (err) {
          alert("Gửi không được, vui lòng gọi trực tiếp.");
        }
      });

      function cleanup() {
        const DAYS_DONE = 90; // đơn "Hoàn thành" giữ bao nhiêu ngày
        const sh = SpreadsheetApp.getActive().getSheetByName(SHEET_NAME);
        const data = sh.getDataRange().getValues();
        const limit = new Date(Date.now() - DAYS_DONE * 24 * 60 * 60 * 1000);

        for (let i = data.length - 1; i >= 1; i--) {
          const time = new Date(data[i][0]);
          const status = data[i][5]; // cột F

          if (status === "Hủy") {
            sh.deleteRow(i + 1);
          } else if (status === "Hoàn thành" && time < limit) {
            sh.deleteRow(i + 1);
          }
        }
      }
    </script>
  </body>
</html>
